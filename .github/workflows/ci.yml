name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core + dev
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (bug-catching rules)
        run: python -m ruff check uzen tests
      - name: Core test suite
        run: python -m pytest -q

  optional-runtimes:
    name: Optional runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api,workers,onnx,safetensors]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Full test suite
        run: python -m pytest -q

  syntax:
    name: Syntax and import checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q uzen tests
      - run: python -m pip install -e .
      - run: python -c "import uzen; print(uzen.__version__ if hasattr(uzen, '__version__') else 'uzen imported')"

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import uzen; print('wheel installed')"
