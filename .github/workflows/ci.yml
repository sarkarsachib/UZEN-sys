name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_hf:
        description: Download tiny Hugging Face fixtures and run live tests
        type: boolean
        default: false

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core + dev
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Dependency check
        run: python -m pip check
      - name: Lint (bug-catching rules)
        run: python -m ruff check uzen tests
      - name: Core test suite
        run: python -m pytest -q

  optional-runtimes:
    name: Optional runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api,workers,onnx,safetensors,tokenizer,hf]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Dependency check
        run: python -m pip check
      - name: Full test suite
        run: python -m pytest -q

  live-hf:
    name: Live Hugging Face tests (tiny GPT-2 and Llama)
    # Opt-in: set the repository variable UZEN_RUN_LIVE_HF=1, or dispatch this
    # workflow manually with live_hf enabled. Normal pushes and PRs skip the job.
    if: vars.UZEN_RUN_LIVE_HF == '1' || (github.event_name == 'workflow_dispatch' && inputs.live_hf)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core, test and HF reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,hf-reference,tokenizer]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Dependency check
        run: python -m pip check
      - name: Live Hugging Face tests
        env:
          UZEN_LIVE_HF: "1"
        run: python -m pytest tests/test_live_hf_import.py -q

  syntax:
    name: Syntax and import checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q uzen tests
      - run: python -m pip install -e .
      - run: python -c "import uzen; print(uzen.__version__ if hasattr(uzen, '__version__') else 'uzen imported')"

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c "import uzen; print('wheel installed', uzen.__file__)"
