[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uzen"
version = "0.1.0"
description = "UZEN - Universal Neural Weight Engineering & Architecture Research System (headless computational substrate)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "UZEN" }]
keywords = ["neural-weights", "weight-engineering", "architecture-synthesis", "model-merging", "strict-plus"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core engine intentionally depends only on numpy + pydantic so that the
# deterministic mathematical substrate runs anywhere. Everything heavier is an
# optional extra and is detected at runtime (never faked).
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.5",
]

[project.optional-dependencies]
# PyTorch reference runtime: real torch adapter (tensor bridges, state_dict IO,
# forward execution). Required for .pt/.bin checkpoints and torch modules.
# Install the CPU-only wheel with:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
torch = ["torch>=2.0"]
# Headless REST control plane.
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
# Read/write reference safetensors implementation (UZEN also ships its own codec).
safetensors = ["safetensors>=0.4"]
# Download Hugging Face repositories into the import pipeline.
hf = ["huggingface_hub>=0.23"]
# Encode text with imported tokenizer.json documents (supported transformer inference).
tokenizer = ["tokenizers>=0.20"]
# Optional live GPT-2/Llama/OPT/GPT-NeoX parity against Hugging Face references.
hf-reference = ["huggingface_hub>=0.23", "transformers>=4.40"]
# ONNX interchange (export/import of the supported NIR subset).
onnx = ["onnx>=1.16"]
# Worker daemon remote transport + system profiling.
workers = ["httpx>=0.27", "psutil>=5.9"]
# CUDA kernel compilation without a system CUDA toolkit (NVRTC only; a GPU
# driver and device are still required to execute).
cuda = ["nvidia-cuda-nvrtc-cu12>=12.4"]
dev = ["pytest>=8.0", "pytest-timeout>=2.2", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
uzen = "uzen.interfaces.cli.main:main"

[tool.setuptools.packages.find]
include = ["uzen*"]

[tool.setuptools.package-data]
# The native and CUDA runtimes compile checked-in source on demand; a wheel must
# include it, not just the Python bridges.
"uzen.runtimes.native" = ["*.cpp"]
"uzen.runtimes.cuda" = ["*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Bug-catching rules only: syntax/parse errors, undefined names and invalid
# comparisons. Style rules are intentionally not enforced.
select = ["E9", "F63", "F7", "F82"]
